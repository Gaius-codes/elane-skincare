<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E4D9BE" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#D3A94B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B98E3A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEAE0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0EE"/>
      <stop offset="50%" stop-color="#C9C6BE"/>
      <stop offset="100%" stop-color="#E7E5DF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="500" fill="url(#bg)"/>

  <!-- soft window-light glow -->
  <circle cx="300" cy="110" r="90" fill="#FFFFFF" opacity="0.35" filter="url(#soft)"/>

  <!-- leaf sprig, bottom left -->
  <g stroke="#6B7A57" stroke-width="1.4" fill="none">
    <path d="M55 445 C60 410 68 380 82 352"/>
  </g>
  <g fill="#75855F">
    <path d="M82 352 C95 358 100 372 92 384 C79 378 74 364 82 352 Z"/>
    <path d="M70 380 C85 382 94 394 88 408 C73 406 64 394 70 380 Z"/>
    <path d="M58 412 C74 411 86 421 84 436 C68 437 56 427 58 412 Z"/>
  </g>

  <!-- bottle shadow -->
  <ellipse cx="205" cy="452" rx="66" ry="12" fill="#2B1D14" opacity="0.10"/>

  <!-- dropper cap bulb -->
  <path d="M186 60 C186 40 224 40 224 60 L222 108 L188 108 Z" fill="url(#cap)" stroke="#E3DFD3" stroke-width="1"/>

  <!-- metal ferrule -->
  <rect x="182" y="108" width="46" height="34" rx="2" fill="url(#band)" stroke="#BEBAAE" stroke-width="0.75"/>

  <!-- neck -->
  <path d="M188 142 L222 142 L216 176 L194 176 Z" fill="url(#glass)" stroke="#D8D2C4" stroke-width="1.25"/>

  <!-- bottle shoulder + body -->
  <path
    d="M194 176
       L216 176
       C232 190 244 206 244 226
       L244 404
       C244 416 234 426 222 426
       L188 426
       C176 426 166 416 166 404
       L166 226
       C166 206 178 190 194 176 Z"
    fill="url(#glass)"
    stroke="#D8D2C4"
    stroke-width="1.5"
  />

  <!-- glass shine -->
  <rect x="180" y="200" width="8" height="200" rx="4" fill="#FFFFFF" opacity="0.28"/>

  <!-- label -->
  <rect x="172" y="258" width="76" height="98" rx="4" fill="#FFFFFF" fill-opacity="0.94" stroke="#E7E0D2" stroke-width="1"/>

  <text x="210" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" letter-spacing="2" fill="#6B5B45">ÉLANÉ</text>
  <text x="210" y="302" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="0.5" fill="#2B1D14">LUMIÈRE</text>
  <text x="210" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" letter-spacing="0.5" fill="#8A7A63">Radiance Serum</text>
  <text x="210" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" letter-spacing="0.5" fill="#8A7A63">SPF 30</text>
  <line x1="188" y1="341" x2="232" y2="341" stroke="#E7E0D2" stroke-width="1"/>
  <text x="210" y="351" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" letter-spacing="0.5" fill="#B0A48F">30ML / 1 FL OZ</text>
</svg>

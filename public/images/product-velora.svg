<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="jarBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E0D0"/>
      <stop offset="45%" stop-color="#F4EFE3"/>
      <stop offset="100%" stop-color="#DCD3BE"/>
    </linearGradient>
    <linearGradient id="jarLid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DAD2BE"/>
      <stop offset="45%" stop-color="#ECE5D5"/>
      <stop offset="100%" stop-color="#CFC5AC"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="500" fill="url(#bg)"/>

  <!-- soft window-light glow -->
  <circle cx="290" cy="120" r="90" fill="#FFFFFF" opacity="0.35" filter="url(#soft)"/>

  <!-- leaf sprig, bottom left -->
  <g stroke="#6B7A57" stroke-width="1.4" fill="none">
    <path d="M55 445 C60 410 68 380 82 352"/>
  </g>
  <g fill="#75855F">
    <path d="M82 352 C95 358 100 372 92 384 C79 378 74 364 82 352 Z"/>
    <path d="M70 380 C85 382 94 394 88 408 C73 406 64 394 70 380 Z"/>
    <path d="M58 412 C74 411 86 421 84 436 C68 437 56 427 58 412 Z"/>
  </g>

  <!-- jar shadow -->
  <ellipse cx="200" cy="404" rx="76" ry="12" fill="#2B1D14" opacity="0.10"/>

  <!-- jar body -->
  <rect x="132" y="230" width="136" height="160" rx="16" fill="url(#jarBody)" stroke="#D6CDB6" stroke-width="1.25"/>

  <!-- lid -->
  <rect x="122" y="176" width="156" height="60" rx="14" fill="url(#jarLid)" stroke="#CBC1A7" stroke-width="1.25"/>
  <line x1="122" y1="222" x2="278" y2="222" stroke="#C4B99D" stroke-width="1" opacity="0.7"/>

  <!-- soft highlight -->
  <rect x="148" y="244" width="10" height="130" rx="5" fill="#FFFFFF" opacity="0.35"/>

  <!-- label -->
  <rect x="160" y="272" width="80" height="98" rx="4" fill="#FFFFFF" fill-opacity="0.94" stroke="#E7E0D2" stroke-width="1"/>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8" letter-spacing="2" fill="#6B5B45">ÉLANÉ</text>
  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="0.5" fill="#2B1D14">VELORA</text>
  <text x="200" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" letter-spacing="0.4" fill="#8A7A63">Barrier Repair Cream</text>
  <text x="200" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" letter-spacing="0.5" fill="#8A7A63">SPF 30</text>
  <line x1="178" y1="355" x2="222" y2="355" stroke="#E7E0D2" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" letter-spacing="0.5" fill="#B0A48F">50ML / 1.7 FL OZ</text>
</svg>

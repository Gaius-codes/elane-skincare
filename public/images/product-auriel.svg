<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="bottleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E4DECF"/>
      <stop offset="45%" stop-color="#F6F2E8"/>
      <stop offset="100%" stop-color="#D9D0BB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C876A"/>
      <stop offset="100%" stop-color="#616B52"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="500" fill="url(#bg)"/>

  <!-- soft window-light glow -->
  <circle cx="300" cy="110" r="90" fill="#FFFFFF" opacity="0.35" filter="url(#soft)"/>

  <!-- leaf sprig, bottom left -->
  <g stroke="#6B7A57" stroke-width="1.4" fill="none">
    <path d="M55 445 C60 410 68 380 82 352"/>
  </g>
  <g fill="#75855F">
    <path d="M82 352 C95 358 100 372 92 384 C79 378 74 364 82 352 Z"/>
    <path d="M70 380 C85 382 94 394 88 408 C73 406 64 394 70 380 Z"/>
    <path d="M58 412 C74 411 86 421 84 436 C68 437 56 427 58 412 Z"/>
  </g>

  <!-- bottle shadow -->
  <ellipse cx="203" cy="440" rx="58" ry="11" fill="#2B1D14" opacity="0.10"/>

  <!-- bottle body -->
  <rect x="170" y="196" width="66" height="238" rx="14" fill="url(#bottleBody)" stroke="#D6CDB6" stroke-width="1.25"/>

  <!-- shoulder / neck -->
  <path d="M182 196 L224 196 L220 168 L186 168 Z" fill="url(#bottleBody)" stroke="#D6CDB6" stroke-width="1.25"/>

  <!-- pump collar -->
  <rect x="182" y="150" width="38" height="20" rx="3" fill="url(#capGrad)"/>

  <!-- pump head -->
  <rect x="188" y="130" width="26" height="22" rx="6" fill="url(#capGrad)"/>

  <!-- pump arm -->
  <path d="M214 138 L242 138 L242 146 L220 146 Z" fill="url(#capGrad)"/>
  <circle cx="244" cy="142" r="5" fill="#616B52"/>

  <!-- soft highlight -->
  <rect x="182" y="212" width="8" height="200" rx="4" fill="#FFFFFF" opacity="0.35"/>

  <!-- label -->
  <rect x="176" y="248" width="54" height="112" rx="4" fill="#FFFFFF" fill-opacity="0.94" stroke="#E7E0D2" stroke-width="1"/>

  <text x="203" y="266" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6.5" letter-spacing="1.5" fill="#6B5B45">ÉLANÉ</text>
  <text x="203" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="0.3" fill="#2B1D14">AURIEL</text>
  <text x="203" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.5" letter-spacing="0.3" fill="#8A7A63">Hydrating Essence</text>
  <text x="203" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" letter-spacing="0.4" fill="#8A7A63">SPF 30</text>
  <line x1="184" y1="322" x2="222" y2="322" stroke="#E7E0D2" stroke-width="1"/>
  <text x="203" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" letter-spacing="0.4" fill="#B0A48F">40ML / 1.3 FL OZ</text>
</svg>
